# Astro Jungle Edge — browser worker on a free GitHub Actions schedule.
# Put this file at .github/workflows/edge-worker.yml in a PRIVATE repo with edge-worker.mjs at the root.
# Repository secrets: EDGE_ENDPOINT (https://YOUR-EDGE-SITE/wp-json/aje/v1), EDGE_KEY_1, EDGE_KEY_2, EDGE_KEY_3 (one per worker source; add more to the matrix as needed)
name: Edge worker
on:
  schedule:
    - cron: '23 22 * * *'   # 01:23 Kuwait daily — off the hour (GitHub delays or drops on-the-hour schedules); before the 06:00 server run and 08:00 report
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        key: [EDGE_KEY_1, EDGE_KEY_2, EDGE_KEY_3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node edge-worker.mjs --endpoint "${{ secrets.EDGE_ENDPOINT }}" --key "${{ secrets[matrix.key] }}" --concurrency 1
